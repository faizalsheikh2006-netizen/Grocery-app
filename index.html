<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f1b33"/><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230f1b33'/%3E%3Ccircle cx='256' cy='256' r='110' fill='%2322c55e'/%3E%3C/svg%3E"/><title>GroceryOS</title></head>
<body><script>
function showErr(m){var r=document.getElementById('root');if(r&&!r.children.length)r.innerHTML='<pre style="white-space:pre-wrap;padding:16px;color:#b91c1c;font:14px sans-serif">GroceryOS error:\n'+m+'</pre>'}
window.addEventListener('error',function(e){showErr(e.message+' '+(e.filename||''))});
window.addEventListener('unhandledrejection',function(e){showErr(String(e.reason))});
</script><div id="root"></div><script type="module" src="/main.tsx"></script></body></html>
